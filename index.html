<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.S Network - Official Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); }
    .locked-level { opacity: 0.5; filter: grayscale(0.8); }
  </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

  <div class="max-w-md w-full space-y-5 my-4">

    <!-- Header Title -->
    <div class="text-center mb-2">
      <h1 class="text-3xl font-black italic text-blue-500 uppercase tracking-wider">P.S NETWORK</h1>
      <p class="text-xs text-slate-400 uppercase tracking-widest">Sadasya Dashboard & Portal</p>
    </div>

    <!-- LOGGED-IN USER PROFILE BAR -->
    <div id="userProfileBar" class="hidden glass p-4 rounded-2xl border border-emerald-500/40 flex justify-between items-center">
      <div>
        <p id="profileName" class="text-sm font-bold text-emerald-400">👤 User</p>
        <p id="profileMobile" class="text-xs text-slate-400">📱 Mobile</p>
      </div>
      <button onclick="logoutUser()" class="bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
        Log Out 🚪
      </button>
    </div>

    <!-- AUTH CONTAINER (Login & Register) -->
    <div id="authContainer" class="glass p-5 rounded-[1.5rem] border border-slate-700 shadow-xl space-y-4">
      
      <!-- Tab Selection -->
      <div class="flex border-b border-slate-700 pb-2">
        <button id="tabLoginBtn" onclick="switchTab('login')" class="flex-1 text-center pb-2 text-sm font-bold border-b-2 border-blue-500 text-blue-400">
          🔑 Login
        </button>
        <button id="tabRegBtn" onclick="switchTab('register')" class="flex-1 text-center pb-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white">
          📝 Register
        </button>
      </div>

      <!-- 1. LOGIN FORM -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Mobile Number</label>
          <input type="tel" id="loginMobile" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="Enter Registered Mobile Number">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="Enter Password">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-lg text-white transition-all">
          Login To Account
        </button>
      </form>

      <!-- 2. REGISTER FORM -->
      <form id="regForm" onsubmit="handleRegister(event)" class="space-y-2.5 text-xs hidden">
        <div>
          <label class="block text-slate-400 mb-1">Full Name</label>
          <input type="text" id="regName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Enter Name">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Mobile Number</label>
          <input type="tel" id="regMobile" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Enter Mobile Number">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Create Password</label>
          <input type="password" id="regPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Set Your Password">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Package (Level)</label>
            <select id="regPackage" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
              <option value="100">Level 1 - ₹100</option>
              <option value="200">Level 2 - ₹200</option>
              <option value="500">Level 3 - ₹500</option>
              <option value="1000">Level 4 - ₹1000</option>
              <option value="2000">Level 5 - ₹2000</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Referral ID</label>
            <input type="text" id="regRefId" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Optional">
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Payment UTR / Ref No.</label>
          <input type="text" id="regUtr" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Enter UTR Number">
        </div>
        <button type="submit" id="subBtn" class="w-full bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 font-bold py-2.5 rounded-lg text-white shadow-lg transition-all mt-1">
          Register & Join Now
        </button>
      </form>

    </div>

    <!-- DASHBOARD LEVELS CONTAINER -->
    <div class="glass p-6 rounded-[2rem] border border-blue-500/30 shadow-2xl space-y-4">
      <h2 class="text-sm font-bold text-center text-slate-300 uppercase tracking-wider">📊 Your Level Progress</h2>
      
      <div id="loadingText" class="text-center text-amber-400 font-bold text-sm py-4 animate-pulse">
        ⏳ Loading Data...
      </div>

      <div id="levelsContainer" class="space-y-3 hidden">
        <!-- Dynamic Load -->
      </div>
    </div>

  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzGUsdscQIU8E2c4__j4e1JHSUqCYkG1NqNLHLyBqeDZdo9xglaaxy3qGi_zsoWfn5Pbg/exec';

    let userData = {
      activeLevel: 0,
      levels: [
        { level: 1, price: 100, paid: false, members: 0, commRate: 55 },
        { level: 2, price: 200, paid: false, members: 0, commRate: 100 },
        { level: 3, price: 500, paid: false, members: 0, commRate: 225 },
        { level: 4, price: 1000, paid: false, members: 0, commRate: 400 },
        { level: 5, price: 2000, paid: false, members: 0, commRate: 700 }
      ]
    };

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('regForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegBtn = document.getElementById('tabRegBtn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLoginBtn.className = "flex-1 text-center pb-2 text-sm font-bold border-b-2 border-blue-500 text-blue-400";
        tabRegBtn.className = "flex-1 text-center pb-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabRegBtn.className = "flex-1 text-center pb-2 text-sm font-bold border-b-2 border-blue-500 text-blue-400";
        tabLoginBtn.className = "flex-1 text-center pb-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white";
      }
    }

    function checkLoginSession() {
      const savedUser = localStorage.getItem('ps_network_user');
      if (savedUser) {
        const user = JSON.parse(savedUser);
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('userProfileBar').classList.remove('hidden');
        document.getElementById('profileName').innerText = "👤 " + (user.name || "Member");
        document.getElementById('profileMobile').innerText = "📱 " + user.mobile;
        loadDashboardData();
      } else {
        document.getElementById('authContainer').classList.remove('hidden');
        document.getElementById('userProfileBar').classList.add('hidden');
        renderLevelsUI();
      }
    }

    // REAL LOGIN FUNCTION WITH GOOGLE SHEET VERIFICATION
    function handleLogin(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.innerText = 'Verifying...';
      loginBtn.disabled = true;

      const mobile = document.getElementById('loginMobile').value.trim();
      const pwd = document.getElementById('loginPassword').value.trim();

      fetch(`${scriptURL}?action=login&mobile=${encodeURIComponent(mobile)}&password=${encodeURIComponent(pwd)}`)
        .then(res => res.json())
        .then(data => {
          loginBtn.innerText = 'Login To Account';
          loginBtn.disabled = false;

          if (data.status === 'success') {
            const userObj = { name: data.name || "Member", mobile: data.mobile };
            localStorage.setItem('ps_network_user', JSON.stringify(userObj));
            alert('✅ Login Successful!');
            checkLoginSession();
          } else {
            alert(data.message || '❌ Sahi Mobile Number ya Password daalein!');
          }
        })
        .catch(err => {
          loginBtn.innerText = 'Login To Account';
          loginBtn.disabled = false;
          alert('❌ Connection Error! Kripya dobara try karein.');
        });
    }

    function handleRegister(e) {
      e.preventDefault();
      const subBtn = document.getElementById('subBtn');
      subBtn.innerText = 'Saving to Sheet...';
      subBtn.disabled = true;

      const name = document.getElementById('regName').value.trim();
      const mobile = document.getElementById('regMobile').value.trim();
      const pwd = document.getElementById('regPassword').value;
      const pkg = document.getElementById('regPackage').value;
      const refId = document.getElementById('regRefId').value.trim();
      const utr = document.getElementById('regUtr').value.trim();

      const params = new URLSearchParams();
      params.append('Name', name);
      params.append('Mobile', mobile);
      params.append('Password', pwd);
      params.append('Package', pkg);
      params.append('Referral_ID', refId);
      params.append('Payment_UTR', utr);

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      })
      .then(() => {
        alert('✅ Registration Successful! Admin approval ke baad aapka level unlock ho jayega.');
        const userObj = { name: name, mobile: mobile };
        localStorage.setItem('ps_network_user', JSON.stringify(userObj));

        document.getElementById('regForm').reset();
        subBtn.innerText = 'Register & Join Now';
        subBtn.disabled = false;

        checkLoginSession();
      })
      .catch(err => {
        alert('❌ Error Saving Data!');
        subBtn.innerText = 'Register & Join Now';
        subBtn.disabled = false;
      });
    }

    function logoutUser() {
      localStorage.removeItem('ps_network_user');
      alert('🔒 Logged Out!');
      userData.activeLevel = 0;
      userData.levels.forEach(l => { l.paid = false; l.members = 0; });
      checkLoginSession();
    }

    function loadDashboardData() {
      const savedUser = localStorage.getItem('ps_network_user');
      if (!savedUser) return;
      const user = JSON.parse(savedUser);

      document.getElementById('loadingText').classList.remove('hidden');

      fetch(scriptURL + "?action=getDashboard&mobile=" + encodeURIComponent(user.mobile))
        .then(res => res.json())
        .then(data => {
          if (data) {
            userData.activeLevel = parseInt(data.levelActive || 0);

            userData.levels[0].members = parseInt(data.count100 || 0);
            userData.levels[1].members = parseInt(data.count200 || 0);
            userData.levels[2].members = parseInt(data.count500 || 0);
            userData.levels[3].members = parseInt(data.count1000 || 0);
            userData.levels[4].members = parseInt(data.count2000 || 0);

            userData.levels[0].paid = userData.activeLevel >= 100;
            userData.levels[1].paid = userData.activeLevel >= 200;
            userData.levels[2].paid = userData.activeLevel >= 500;
            userData.levels[3].paid = userData.activeLevel >= 1000;
            userData.levels[4].paid = userData.activeLevel >= 2000;
          }
          renderLevelsUI();
        })
        .catch(err => {
          renderLevelsUI();
        });
    }

    function renderLevelsUI() {
      document.getElementById('loadingText').classList.add('hidden');
      const container = document.getElementById('levelsContainer');
      container.classList.remove('hidden');
      container.innerHTML = '';

      userData.levels.forEach(item => {
        const recycleLimit = 20;
        const totalCycles = Math.floor(item.members / recycleLimit);
        const currentCycleMembers = item.members % recycleLimit;

        const perMemberBonusRate = item.price * 0.05; 
        const isBonusActive = item.members >= 3;
        const totalBonusEarned = isBonusActive ? (item.members * perMemberBonusRate) : 0;

        const levelIncomeOnly = item.members * item.commRate;
        const grandTotalIncome = levelIncomeOnly + totalBonusEarned;

        const card = document.createElement('div');
        card.className = `bg-slate-900/90 p-4 rounded-xl border transition-all ${item.paid ? 'border-emerald-500 cursor-pointer hover:border-emerald-400' : 'border-slate-800 locked-level'}`;

        let bonusBoxHTML = '';
        if (item.paid) {
          if (isBonusActive) {
            bonusBoxHTML = `
              <div class="mt-2.5 p-2 bg-emerald-950/80 border border-emerald-500/50 rounded-lg text-[11px] text-emerald-300 font-bold">
                🎁 3+ Members Bonus Active! (+₹${perMemberBonusRate}/member) <br>
                Total Bonus: +₹${totalBonusEarned}
              </div>`;
          } else {
            const need = 3 - item.members;
            bonusBoxHTML = `
              <div class="mt-2.5 p-2 bg-amber-950/40 border border-amber-500/30 rounded-lg text-[11px] text-amber-400 font-medium">
                🎯 Bonus Status: ${item.members}/3 (${need} more needed for 5% Bonus per member)
              </div>`;
          }
        }

        let recycleBoxHTML = '';
        if (item.paid) {
          recycleBoxHTML = `
            <div class="mt-2 p-2 bg-blue-950/50 border border-blue-500/30 rounded-lg text-[11px] text-blue-300 flex justify-between items-center">
              <span>🔄 Recycle Progress: <b>${currentCycleMembers}/${recycleLimit}</b></span>
              <span class="bg-blue-600/80 text-white px-2 py-0.5 rounded text-[10px]">Cycles: ${totalCycles}</span>
            </div>`;
        }

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <p class="text-sm font-bold text-white uppercase">LEVEL ${item.level} (₹${item.price})</p>
            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${item.paid ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}">
              ${item.paid ? '🔓 UNLOCKED' : '🔒 LOCKED (Pending)'}
            </span>
          </div>

          ${item.paid ? `
            <div id="details-${item.level}" class="hidden mt-3 pt-3 border-t border-slate-800/80 space-y-2 text-xs">
              <div class="flex justify-between items-center bg-slate-800/60 p-2 rounded-lg">
                <span class="text-slate-300">👥 Total Joined:</span>
                <span class="font-bold text-blue-400 text-sm">${item.members} Members</span>
              </div>
              <div class="flex justify-between items-center bg-slate-800/60 p-2 rounded-lg">
                <span class="text-slate-300">💰 Total Income (with Bonus):</span>
                <span class="font-bold text-emerald-400 text-sm">₹${grandTotalIncome}</span>
              </div>
              ${bonusBoxHTML}${recycleBoxHTML}
            </div>
          ` : `
            <button onclick="alert('Aapka account Pending hai ya ye Level Locked hai. Payment approval ke baad unlock ho jayega.')" class="w-full mt-3 bg-slate-800 text-slate-400 text-xs font-bold py-2 rounded-lg">
              Level ${item.level} Locked
            </button>
          `}
        `;

        if (item.paid) {
          card.addEventListener('click', () => {
            const detailDiv = document.getElementById(`details-${item.level}`);
            detailDiv.classList.toggle('hidden');
          });
        }

        container.appendChild(card);
      });
    }

    window.onload = function() {
      checkLoginSession();
    };
  </script>
</body>
</html>
