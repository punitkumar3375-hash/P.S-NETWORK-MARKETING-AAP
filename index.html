<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.S Network - Official Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); }
    .locked-level { opacity: 0.5; filter: grayscale(0.8); }
  </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

  <div class="max-w-md w-full space-y-6 my-4">

    <!-- Header Title -->
    <div class="text-center mb-2">
      <h1 class="text-3xl font-black italic text-blue-500 uppercase tracking-wider">P.S NETWORK</h1>
      <p class="text-xs text-slate-400 uppercase tracking-widest">सदस्य डैशबोर्ड एवं रजिस्ट्रेशन</p>
    </div>

    <!-- REGISTRATION FORM SECTION -->
    <div class="glass p-5 rounded-[1.5rem] border border-slate-700 shadow-xl space-y-3">
      <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider text-center">📝 New Member Registration</h2>
      <form id="regForm" onsubmit="submitForm(event)" class="space-y-2.5 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">नाम (Full Name)</label>
          <input type="text" id="name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Enter Name">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">मोबाइल नंबर (Mobile No)</label>
          <input type="tel" id="mobile" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Enter Mobile Number">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">Package (Level)</label>
            <select id="package" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
              <option value="100">Level 1 - ₹100</option>
              <option value="200">Level 2 - ₹200</option>
              <option value="500">Level 3 - ₹500</option>
              <option value="1000">Level 4 - ₹1000</option>
              <option value="2000">Level 5 - ₹2000</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Referral ID</label>
            <input type="text" id="refId" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Optional">
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Payment UTR / Ref No.</label>
          <input type="text" id="utr" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500" placeholder="Enter UTR Number">
        </div>
        <button type="submit" id="subBtn" class="w-full bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 font-bold py-2.5 rounded-lg text-white shadow-lg transition-all mt-1">
          Submit & Join Now
        </button>
      </form>
    </div>

    <!-- DASHBOARD LEVELS CONTAINER -->
    <div class="glass p-6 rounded-[2rem] border border-blue-500/30 shadow-2xl space-y-4">
      <h2 class="text-sm font-bold text-center text-slate-300 uppercase tracking-wider">📊 Your Level Progress</h2>
      
      <div id="loadingText" class="text-center text-amber-400 font-bold text-sm py-4 animate-pulse">
        ⏳ गूगल शीट से डेटा लोड हो रहा है...
      </div>

      <!-- LEVELS WRAPPER -->
      <div id="levelsContainer" class="space-y-3 hidden">
        <!-- JavaScript Dynamic Load -->
      </div>
    </div>

  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx0GJ8HVQGfOyMLwDs9bIqKFsr2yUkieMwfT2qH9d_I3m93WbaKMBmW6KO_WpL-jqa7Ig/exec';

    let userData = {
      activeLevel: 100,
      levels: [
        { level: 1, price: 100, paid: true, members: 0, commRate: 15 },
        { level: 2, price: 200, paid: false, members: 0, commRate: 40 },
        { level: 3, price: 500, paid: false, members: 0, commRate: 125 },
        { level: 4, price: 1000, paid: false, members: 0, commRate: 300 },
        { level: 5, price: 2000, paid: false, members: 0, commRate: 700 }
      ]
    };

    // 1. Live Data Read
    function loadDashboardData() {
      fetch(scriptURL + "?action=getDashboard")
        .then(res => res.json())
        .then(data => {
          if (data) {
            const c100 = parseInt(data.count100 || 0);
            const c200 = parseInt(data.count200 || 0);
            const c500 = parseInt(data.count500 || 0);
            const c1000 = parseInt(data.count1000 || 0);
            const c2000 = parseInt(data.count2000 || 0);
            const activeLvl = parseInt(data.levelActive || 100);

            userData.activeLevel = activeLvl;

            userData.levels[0].members = c100;
            userData.levels[1].members = c200;
            userData.levels[2].members = c500;
            userData.levels[3].members = c1000;
            userData.levels[4].members = c2000;

            userData.levels[0].paid = true;
            userData.levels[1].paid = activeLvl >= 200;
            userData.levels[2].paid = activeLvl >= 500;
            userData.levels[3].paid = activeLvl >= 1000;
            userData.levels[4].paid = activeLvl >= 2000;
          }
          renderLevelsUI();
        })
        .catch(err => {
          console.log("Sheet Error: ", err);
          renderLevelsUI();
        });
    }

    // 2. Render UI (Inside Card Details)
    function renderLevelsUI() {
      document.getElementById('loadingText').classList.add('hidden');
      const container = document.getElementById('levelsContainer');
      container.classList.remove('hidden');
      container.innerHTML = '';

      userData.levels.forEach(item => {
        const totalEarning = item.members * item.commRate;
        const bonusTarget = 3;
        const isBonusEarned = item.members >= bonusTarget;
        const bonusAmount = item.price * 0.10;

        const card = document.createElement('div');
        card.className = `bg-slate-900/90 p-4 rounded-xl border transition-all ${item.paid ? 'border-emerald-500 cursor-pointer hover:border-emerald-400' : 'border-slate-800 locked-level'}`;

        let bonusBoxHTML = '';
        if (item.paid) {
          if (isBonusEarned) {
            bonusBoxHTML = `
              <div class="mt-2.5 p-2 bg-emerald-950/80 border border-emerald-500/50 rounded-lg text-[11px] text-emerald-300 font-bold">
                🎉 3 Referrals Completed! Bonus Earned: +₹${bonusAmount}
              </div>`;
          } else {
            const need = bonusTarget - item.members;
            bonusBoxHTML = `
              <div class="mt-2.5 p-2 bg-amber-950/40 border border-amber-500/30 rounded-lg text-[11px] text-amber-400 font-medium">
                🎯 Bonus Progress: ${item.members}/3 (${need} more needed for ₹${bonusAmount} Bonus)
              </div>`;
          }
        }

        // Inside-Card View Logic
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <p class="text-sm font-bold text-white uppercase">LEVEL ${item.level} (₹${item.price})</p>
            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${item.paid ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}">
              ${item.paid ? '🔓 UNLOCKED' : '🔒 LOCKED'}
            </span>
          </div>

          <!-- Card Ke Andar Khulne Waali Details -->
          ${item.paid ? `
            <div id="details-${item.level}" class="hidden mt-3 pt-3 border-t border-slate-800/80 space-y-2 text-xs">
              <div class="flex justify-between items-center bg-slate-800/60 p-2 rounded-lg">
                <span class="text-slate-300">👥 Total Joined:</span>
                <span class="font-bold text-blue-400 text-sm">${item.members} Members</span>
              </div>
              <div class="flex justify-between items-center bg-slate-800/60 p-2 rounded-lg">
                <span class="text-slate-300">💰 Level Income:</span>
                <span class="font-bold text-emerald-400 text-sm">₹${totalEarning}</span>
              </div>
              ${bonusBoxHTML}
            </div>
          ` : `
            <button onclick="alert('Level ${item.level} unlock karne ke liye admin se sampark karein.')" class="w-full mt-3 bg-slate-800 text-slate-400 text-xs font-bold py-2 rounded-lg">
              Level ${item.level} Locked
            </button>
          `}
        `;

        if (item.paid) {
          card.addEventListener('click', () => {
            const detailDiv = document.getElementById(`details-${item.level}`);
            detailDiv.classList.toggle('hidden');
          });
        }

        container.appendChild(card);
      });
    }

    // 3. Submit Form Data
    function submitForm(e) {
      e.preventDefault();
      const subBtn = document.getElementById('subBtn');
      subBtn.innerText = 'Submitting...';
      subBtn.disabled = true;

      const formData = new FormData();
      formData.append('Name', document.getElementById('name').value);
      formData.append('Mobile', document.getElementById('mobile').value);
      formData.append('Package', document.getElementById('package').value);
      formData.append('Referral_ID', document.getElementById('refId').value);
      formData.append('Payment_UTR', document.getElementById('utr').value);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(res => res.text())
        .then(response => {
          alert('✅ Request Submitted Successfully! Admin verification ke baad aapka level unlock ho jayega.');
          document.getElementById('regForm').reset();
          subBtn.innerText = 'Submit & Join Now';
          subBtn.disabled = false;
          loadDashboardData();
        })
        .catch(err => {
          alert('❌ Error submitting form!');
          subBtn.innerText = 'Submit & Join Now';
          subBtn.disabled = false;
        });
    }

    window.onload = loadDashboardData;
  </script>
</body>
</html>
